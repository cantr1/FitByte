name: FitByte CI Pipeline

# Run pipeline on each push
on: push

jobs:
  # Run Golang unit tests
  go_tests:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Race detection
        run: go test -race -cover ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Security Checks
        # sqlc's token query constants are parameterized SQL, not credentials.
        # Keep all other rules enabled for this generated file.
        run: gosec -exclude-rules='internal/database/tokens\.sql\.go$:G101' ./...

  # Run Terraform Validation
  terraform_validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
